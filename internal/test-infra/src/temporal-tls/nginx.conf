events {}

http {
  resolver 127.0.0.11 valid=5s;

  grpc_read_timeout 300s;
  grpc_send_timeout 300s;
  client_body_timeout 300s;

  ssl_certificate /etc/nginx/tls/server-cert.pem;
  ssl_certificate_key /etc/nginx/tls/server-key.pem;

  # mTLS: a client certificate the test CA signed.
  server {
    listen 7233 ssl;
    http2 on;
    ssl_client_certificate /etc/nginx/tls/ca.pem;
    ssl_verify_client on;
    set $temporal temporal:7233;

    location / {
      grpc_pass grpc://$temporal;
    }
  }

  # TLS and an API key: a bearer token of the test prefix.
  server {
    listen 7234 ssl;
    http2 on;
    set $temporal temporal:7233;

    location / {
      if ($http_authorization !~ "^Bearer temporal-test-") {
        return 403;
      }
      grpc_pass grpc://$temporal;
    }
  }
}
