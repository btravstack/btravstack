autoInstallPeers: false
dedupePeerDependents: true
engineStrict: true
# Three days. A compromised release is usually yanked within hours of being
# noticed, and the window between publish and discovery is the one a lockfile
# cannot protect against. The exact-pinned catalog already slows adoption for
# everything listed there, so what this actually guards is `pnpm add` and
# `pnpm dlx` — the two commands that reach for `latest` without a review.
minimumReleaseAge: 4320
saveExact: true
strictPeerDependencies: true

packages:
  - packages/*
  - examples/*
  - internal/*
  - docs

catalog:
  # `@amqp-contract/{contract,testing,worker}` v3 are still in beta and their
  # `latest` dist-tag is the 2.4.0 line, which peers on `unthrown@^4` while
  # this repo pins 5.8.0. The exact beta is the contract until v3 goes stable;
  # raise it deliberately, not on a bot bump.
  # RustFS is pre-1.0 and its `latest` tag moves; the gate pins the exact
  # release candidate it was measured against (put, get with content type,
  # presigned GET, idempotent delete — all verified before the port was
  # written). Raise it deliberately, not on a bot bump.
  "@aws-sdk/client-s3": 3.1127.0
  "@aws-sdk/s3-request-presigner": 3.1127.0
  "@amqp-contract/client": 3.0.0-beta.7
  "@amqp-contract/contract": 3.0.0-beta.7
  "@amqp-contract/testing": 3.0.0-beta.7
  "@amqp-contract/worker": 3.0.0-beta.7
  "@btravstack/commitlint": 0.1.0
  "@btravstack/entity": 0.7.0
  "@btravstack/lefthook": 0.1.1
  "@btravstack/oxlint": 0.2.1
  "@btravstack/theme": 2.0.0
  "@btravstack/tsconfig": 0.4.0
  "@btravstack/typedoc": 0.1.0
  "@changesets/cli": 3.0.2
  "@commitlint/cli": 21.2.2
  # `@amqp-contract/core`'s telemetry module (pulled in by
  # `@amqp-contract/worker`) has a static, unconditional `import
  # "@opentelemetry/api"` despite declaring the peer `optional` in its own
  # package.json — the ESM build does not actually honour the optionality, so
  # anything that imports `@amqp-contract/worker` fails to load at all without
  # this installed. Not a `devDependency` alone: a real consumer of
  # `@btravstack/amqp-worker` hits the same load failure.
  "@opentelemetry/api": 1.9.1
  "@opentelemetry/sdk-node": 0.222.0
  "@opentelemetry/sdk-metrics": 2.11.0
  "@opentelemetry/sdk-trace": 2.11.0
  # oRPC v2 is still in beta and its `latest` dist-tag is the 1.x line, while
  # `@unthrown/orpc` peers on `^2.0.0-beta` — an unpinned range resolves 1.x
  # and fails `strictPeerDependencies`. The exact beta is the contract.
  "@orpc/client": 2.0.0-beta.28
  "@orpc/contract": 2.0.0-beta.28
  "@orpc/json-schema": 2.0.0-beta.28
  "@orpc/openapi": 2.0.0-beta.28
  "@orpc/server": 2.0.0-beta.28
  "@orpc/tanstack-query": 2.0.0-beta.28
  # Prisma 8 is a different package family, not a version bump: the runtime is
  # `@prisma/orm-postgres` ("the one package a Postgres application installs")
  # and `@prisma/client` / `@prisma/adapter-pg` / `@prisma/instrumentation` have
  # no successor. `@prisma/client` never published an 8.x line at all. The CLI's
  # `latest` IS the RC, and it is pinned exactly for the reason oRPC's beta is:
  # the surface moves between release candidates.
  "@prisma/cli-engine": 0.4.0
  "@prisma/orm-postgres": 8.0.0-rc.11
  "@tanstack/query-core": 5.102.8
  # `@temporal-contract/*` v8 is still in beta and its `latest` dist-tag is the
  # 7.x line, which peers on `unthrown@^4` while this repo pins 5.8.0. 8.x also
  # ships the `test-rig` / `workflow-bundle` subpaths the Temporal example's
  # specs are built on. The exact beta is the contract until v8 goes stable.
  "@temporal-contract/client": 8.0.0-beta.9
  "@temporal-contract/contract": 8.0.0-beta.9
  "@temporal-contract/testing": 8.0.0-beta.9
  "@temporal-contract/worker": 8.0.0-beta.9
  "@temporalio/activity": 1.23.0
  "@temporalio/client": 1.23.0
  "@temporalio/common": 1.23.0
  "@temporalio/testing": 1.23.0
  "@temporalio/worker": 1.23.0
  "@temporalio/workflow": 1.23.0
  "@types/nodemailer": 8.0.1
  "@types/node": 26.4.1
  "@unthrown/oxlint": 5.8.0
  "@unthrown/orpc": 0.2.0
  "@unthrown/standard-schema": 5.8.0
  "@unthrown/vitest": 5.8.0
  jose: 6.2.12
  knip: 6.34.0
  markdownlint-cli2: 0.23.2
  lefthook: 2.1.12
  oxfmt: 0.66.0
  oxlint: 1.81.0
  pino: 10.3.1
  nodemailer: 10.0.0
  openid-client: 6.8.8
  prisma: 8.0.0-rc.15
  uuidv7: 1.2.1
  redis: 6.2.1
  tsdown: 0.23.0
  tsx: 4.23.13
  turbo: 2.10.12
  typedoc: 0.28.20
  typedoc-plugin-markdown: 4.13.0
  testcontainers: 12.1.0
  typescript: 7.0.2
  # The TypeScript a *consumer* is realistically on, for the second
  # declaration-emit pass in `examples/di-hexagonal`
  # (`tsconfig.emit.json`, compiled once by each version). 7.0.2 is the native
  # port and the one this repo builds with; a published package has to be
  # readable by the stable line too, and the two emitters do not agree on
  # everything. Aliased because one `package.json` cannot name `typescript`
  # twice.
  typescript-consumer: "npm:typescript@5.9.3"
  # The two tarball linters `internal/consumer-check` runs. Neither is imported
  # by anything: they are invoked as binaries, once per package, from a script.
  publint: 0.3.15
  "@arethetypeswrong/cli": 0.18.5
  unthrown: 5.8.0
  "@vitest/coverage-v8": 4.1.11
  vitepress: 1.6.4
  vitest: 4.1.11
  zod: 4.5.4

catalogs:
  # TypeDoc's own TypeScript: 7.x is the native port and ships no `typescript.js`,
  # so 6.0.3 is the last release carrying the JS API TypeDoc needs. Only `docs`
  # resolves this catalog.
  typedoc:
    typescript: 6.0.3

# Force patched versions of vulnerable transitive dependencies. Every advisory
# below reaches us only through dev/build tooling (never a published package's
# runtime deps). Each selector is version-scoped so only the affected line moves.
overrides:
  # GHSA-fx2h-pf6j-xcff, GHSA-4w7w-66w2-5vf9, GHSA-v6wh-96g9-6wx3: vite
  # `server.fs.deny` bypasses (dev-server only; the docs ship as static HTML).
  # Reaches us via docs > vitepress > vite. vitepress 1.6.x pins vite ^5.4.14 and
  # 5.x has no patched release, so lift any pre-6.4.3 vite to 6.4.3 (the first
  # fixed version), as unthrown does — `vitepress build` is verified against it.
  # This also drags esbuild up past GHSA-67mh-4wv8-2f99.
  "vite@<6.4.3": "6.4.3"
  # GHSA-7w5x-hrqm-74c2: smol-toml denial of service on a malformed TOML
  # document. Reaches us via markdownlint-cli2 > smol-toml, which reads a
  # `.markdownlint-cli2.toml` this repository does not have — the config here is
  # `.markdownlint-cli2.jsonc`, so the parser is never handed a document at all,
  # and nothing published depends on it. markdownlint-cli2@0.23.2 is latest and
  # pins smol-toml at 1.7.0, one below the advisory's first patched 1.7.1, so
  # there is nothing upstream to take; lift the line to 1.8.0. Drop this when
  # markdownlint-cli2 ships a release that takes 1.7.1 or later.
  "smol-toml@<1.7.1": "1.8.0"
  # GHSA-3f6p-5ww8-9rcr: mysql2 lets a hostile server downgrade authentication to
  # `mysql_clear_password`, which sends the password in plaintext. It used to
  # reach us through the Prisma 7 CLI bundling a driver per datasource; on
  # Prisma 8 the path is `prisma` > `@prisma/composer-cli` > `alchemy`, one of
  # the five below. Still installed, still never loaded — this example's
  # datasource is PostgreSQL — and `pnpm audit` is still right to say so.
  "mysql2@<3.22.0": "3.24.2"
  # The next four all arrive on ONE path and none of them is ever loaded:
  #
  #   prisma > @prisma/composer-cli > alchemy > @prisma/dev > …
  #
  # `@prisma/dev` is Prisma 8's local development server and `alchemy` its
  # deploy half. This repository runs `contract emit`, `migration plan` and
  # `db migrate` and never `prisma composer` or `prisma dev`, which is the same
  # reason `workerd` and `msgpackr-extract` are refused a build script below.
  # Installed is installed, so each is lifted to its first patched release
  # rather than waived — and each selector is version-scoped, so only the
  # affected line moves. Re-measure when the `prisma` pin is raised: the RC's
  # transitive tree is still moving, and an override whose path has gone is
  # the kind of dead line the v7 `deepmerge-ts` one became.
  #
  # GHSA (37 advisories): Hono, reached as `@prisma/dev`'s HTTP server —
  # serveStatic arbitrary file access, body-limit bypasses, JWT NumericDate
  # validation. 4.13.5 is the first release past all of them; 4.13.7 rather
  # than the newer 4.13.8 because `minimumReleaseAge` refuses a package
  # published inside the last three days, and taking the exclusion instead
  # would waive the supply-chain window for a transitive dev dependency
  # nothing here loads.
  "hono@<4.13.5": "4.13.7"
  # The node adapter's own: an authorization bypass for protected static files
  # and a middleware bypass via repeated slashes.
  "@hono/node-server@<1.19.15": "1.19.15"
  # GHSA: lodash `_.template` code injection and prototype pollution via an
  # array path. Reached through `@mrleebo/prisma-ast` > chevrotain.
  "lodash@<4.18.1": "4.18.1"
  # GHSA: valibot's `record()` issue paths make `flatten()` throw.
  "valibot@<1.4.2": "1.5.0"

allowBuilds:
  # Both reach us through the Prisma 8 CLI's deploy half — `prisma` >
  # `@prisma/composer-cli` > `alchemy` > `@alchemy.run/cloudflare-runtime`.
  # `workerd` downloads a Cloudflare Workers runtime binary and
  # `msgpackr-extract` builds a native msgpack accelerator that `msgpackr`
  # falls back off when it is absent. This repository runs `contract emit`,
  # `db init` and `db migrate` and never `prisma composer`, so neither is
  # loaded — refused rather than allowed, the way `@prisma/engines` was.
  workerd: false
  msgpackr-extract: false
  # Pulled in by @temporalio/*; both allowed upstream in temporal-contract.
  "@swc/core": true
  protobufjs: true
  esbuild: true
  lefthook: true
  prisma: true
  cpu-features: false
  ssh2: false

peerDependencyRules:
  ignoreMissing:
    # React peers of `@prisma/studio-core`, pulled in transitively by the
    # `prisma` CLI (v7 bundles Prisma Studio). We never run `prisma studio`.
    - react
    - react-dom
    - "@types/react"
    # Optional peer of `@docsearch/react`, pulled in transitively by vitepress.
    - search-insights
