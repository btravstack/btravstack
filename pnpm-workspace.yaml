autoInstallPeers: false
dedupePeerDependents: true
engineStrict: true
saveExact: true
strictPeerDependencies: true

packages:
  - packages/*
  - examples/*
  - internal/*
  - docs

catalog:
  # `@amqp-contract/{contract,testing,worker}` v3 are still in beta and their
  # `latest` dist-tag is the 2.4.0 line, which peers on `unthrown@^4` while
  # this repo pins 5.7.0. The exact beta is the contract until v3 goes stable;
  # raise it deliberately, not on a bot bump.
  # RustFS is pre-1.0 and its `latest` tag moves; the gate pins the exact
  # release candidate it was measured against (put, get with content type,
  # presigned GET, idempotent delete — all verified before the port was
  # written). Raise it deliberately, not on a bot bump.
  "@aws-sdk/client-s3": 3.1121.0
  "@aws-sdk/s3-request-presigner": 3.1121.0
  "@amqp-contract/client": 3.0.0-beta.6
  "@amqp-contract/contract": 3.0.0-beta.6
  "@amqp-contract/testing": 3.0.0-beta.6
  "@amqp-contract/worker": 3.0.0-beta.6
  "@btravstack/commitlint": 0.1.0
  "@btravstack/entity": 0.7.0
  "@btravstack/lefthook": 0.1.1
  "@btravstack/oxlint": 0.2.1
  "@btravstack/theme": 2.0.0
  "@btravstack/tsconfig": 0.2.0
  "@btravstack/typedoc": 0.1.0
  "@changesets/cli": 3.0.1
  "@commitlint/cli": 21.2.2
  # `@amqp-contract/core`'s telemetry module (pulled in by
  # `@amqp-contract/worker`) has a static, unconditional `import
  # "@opentelemetry/api"` despite declaring the peer `optional` in its own
  # package.json — the ESM build does not actually honour the optionality, so
  # anything that imports `@amqp-contract/worker` fails to load at all without
  # this installed. Not a `devDependency` alone: a real consumer of
  # `@btravstack/amqp-worker` hits the same load failure.
  "@opentelemetry/api": 1.9.1
  "@opentelemetry/sdk-node": 0.221.0
  "@opentelemetry/sdk-metrics": 2.10.0
  "@opentelemetry/sdk-trace": 2.10.0
  # oRPC v2 is still in beta and its `latest` dist-tag is the 1.x line, while
  # `@unthrown/orpc` peers on `^2.0.0-beta` — an unpinned range resolves 1.x
  # and fails `strictPeerDependencies`. The exact beta is the contract.
  "@orpc/client": 2.0.0-beta.28
  "@orpc/contract": 2.0.0-beta.28
  "@orpc/json-schema": 2.0.0-beta.28
  "@orpc/openapi": 2.0.0-beta.28
  "@orpc/server": 2.0.0-beta.28
  "@prisma/adapter-pg": 7.10.0
  "@prisma/client": 7.10.0
  "@prisma/instrumentation": 7.10.0
  # `@temporal-contract/*` v8 is still in beta and its `latest` dist-tag is the
  # 7.x line, which peers on `unthrown@^4` while this repo pins 5.7.0. 8.x also
  # ships the `test-rig` / `workflow-bundle` subpaths the Temporal example's
  # specs are built on. The exact beta is the contract until v8 goes stable.
  "@temporal-contract/client": 8.0.0-beta.5
  "@temporal-contract/contract": 8.0.0-beta.5
  "@temporal-contract/testing": 8.0.0-beta.5
  "@temporal-contract/worker": 8.0.0-beta.5
  "@temporalio/activity": 1.23.0
  "@temporalio/client": 1.23.0
  "@temporalio/common": 1.23.0
  "@temporalio/testing": 1.23.0
  "@temporalio/worker": 1.23.0
  "@temporalio/workflow": 1.23.0
  "@types/nodemailer": 8.0.1
  "@types/supertest": 7.2.1
  "@types/node": 26.4.0
  "@unthrown/oxlint": 5.7.0
  "@unthrown/orpc": 0.2.0
  "@unthrown/prisma": 0.4.0
  "@unthrown/standard-schema": 5.7.0
  "@unthrown/vitest": 5.7.0
  knip: 6.32.2
  lefthook: 2.1.10
  oxfmt: 0.64.0
  oxlint: 1.79.0
  pino: 10.3.1
  nodemailer: 9.0.5
  prisma: 7.10.0
  uuidv7: 1.2.1
  redis: 6.2.1
  tsdown: 0.22.14
  tsx: 4.23.12
  turbo: 2.10.11
  typedoc: 0.28.20
  typedoc-plugin-markdown: 4.12.0
  testcontainers: 12.1.0
  typescript: 7.0.2
  # The TypeScript a *consumer* is realistically on, for the second
  # declaration-emit pass in `examples/di-hexagonal`
  # (`tsconfig.emit.json`, compiled once by each version). 7.0.2 is the native
  # port and the one this repo builds with; a published package has to be
  # readable by the stable line too, and the two emitters do not agree on
  # everything. Aliased because one `package.json` cannot name `typescript`
  # twice.
  typescript-consumer: "npm:typescript@5.9.3"
  unthrown: 5.7.0
  "@vitest/coverage-v8": 4.1.11
  vitepress: 1.6.4
  supertest: 7.2.2
  vitest: 4.1.11
  zod: 4.4.3

catalogs:
  # TypeDoc's own TypeScript: 7.x is the native port and ships no `typescript.js`,
  # so 6.0.3 is the last release carrying the JS API TypeDoc needs. Only `docs`
  # resolves this catalog.
  typedoc:
    typescript: 6.0.3

# Force patched versions of vulnerable transitive dependencies. Every advisory
# below reaches us only through dev/build tooling (never a published package's
# runtime deps). Each selector is version-scoped so only the affected line moves.
overrides:
  # GHSA-fx2h-pf6j-xcff, GHSA-4w7w-66w2-5vf9, GHSA-v6wh-96g9-6wx3: vite
  # `server.fs.deny` bypasses (dev-server only; the docs ship as static HTML).
  # Reaches us via docs > vitepress > vite. vitepress 1.6.x pins vite ^5.4.14 and
  # 5.x has no patched release, so lift any pre-6.4.3 vite to 6.4.3 (the first
  # fixed version), as unthrown does — `vitepress build` is verified against it.
  # This also drags esbuild up past GHSA-67mh-4wv8-2f99.
  "vite@<6.4.3": "6.4.3"
  # GHSA-ggr8-5vv4-36mx: deepmerge-ts stack exhaustion when merging recursive
  # object graphs. Reaches us via examples/order-infrastructure > prisma >
  # @prisma/config > deepmerge-ts — the CLI at `generate` time, never a
  # published package's runtime deps. Re-measured 2026-08-25: prisma@7.9.1 is
  # still latest and @prisma/config@7.9.1 pins deepmerge-ts at an exact 7.1.5,
  # so there is nothing upstream to take (7.1.6 exists and is still under the
  # advisory's first patched 8.0.0); lift any pre-8 line to 8.0.2. Dropping it
  # brings the advisory straight back — verified. Issue #54 holds it.
  "deepmerge-ts@<8.0.0": "8.0.2"

allowBuilds:
  # Prisma 7 is engine-less (WASM query compiler); nothing to build or download.
  "@prisma/engines": false
  # Pulled in by @temporalio/*; both allowed upstream in temporal-contract.
  "@swc/core": true
  protobufjs: true
  esbuild: true
  lefthook: true
  prisma: true
  cpu-features: false
  ssh2: false

peerDependencyRules:
  ignoreMissing:
    # React peers of `@prisma/studio-core`, pulled in transitively by the
    # `prisma` CLI (v7 bundles Prisma Studio). We never run `prisma studio`.
    - react
    - react-dom
    - "@types/react"
    # Optional peer of `@docsearch/react`, pulled in transitively by vitepress.
    - search-insights

minimumReleaseAgeExclude:
  # First-party shared config (@btravstack scope): adopt immediately, skip the delay.
  - "@btravstack/theme"
  - "@btravstack/typedoc"
  - "@amqp-contract/contract@3.0.0-beta.6"
  - "@amqp-contract/core@3.0.0-beta.6"
  - "@amqp-contract/testing@3.0.0-beta.6"
  - "@amqp-contract/worker@3.0.0-beta.6"
  - "@btravstack/entity@0.7.0"
  - "@unthrown/orpc@0.2.0"
  - "@unthrown/oxlint@5.7.0"
  - "@unthrown/prisma@0.4.0"
  - "@unthrown/standard-schema@5.7.0"
  - "@unthrown/vitest@5.7.0"
  - "unthrown@5.7.0"
  - "@aws-sdk/client-s3@3.1117.0"
  - "@aws-sdk/s3-request-presigner@3.1117.0"
  - "@prisma/instrumentation@7.10.0"
