<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 156 160" width="156" height="160" fill="none">
  <!-- start: the chequered-flag beet. The kernel waves the race underway —
       one arm thrust high, a real black-and-white chequered flag streaming
       from the pole, wind strokes in the package green trailing the cloth.
       Dark-canvas variant: pole grey and check values are the ones that read
       against #100F12; the beet itself never changes between variants. -->
  <defs>
    <pattern id="checks" patternUnits="userSpaceOnUse" width="15" height="15" patternTransform="rotate(-7)">
      <rect width="15" height="15" fill="#EDE9F0"/>
      <rect width="7.5" height="7.5" fill="#3A3540"/>
      <rect x="7.5" y="7.5" width="7.5" height="7.5" fill="#3A3540"/>
    </pattern>
    <clipPath id="cloth">
      <path d="M0,0 C14,-6 30,7 52,-3 L48,18 C27,26 13,13 -2,19 Z"/>
    </clipPath>
  </defs>
  <g stroke="#7ED09A" stroke-width="4" stroke-linecap="round" opacity="0.8">
    <path d="M56,16 L70,14"/>
    <path d="M50,27 L66,25"/>
    <path d="M59,37 L72,35"/>
  </g>
  <path d="M80,88 L93,12" stroke="#8A94A3" stroke-width="4" stroke-linecap="round"/>
  <g transform="translate(92,16) rotate(4)">
    <g clip-path="url(#cloth)">
      <rect x="-4" y="-8" width="60" height="36" fill="url(#checks)"/>
      <path d="M52,-3 C44,5 37,8 30,8 L28,22 C35,23 42,21 48,18 Z" fill="#000000" opacity="0.18"/>
    </g>
  </g>
  <g transform="translate(12,52) scale(0.75)">
    <g transform="rotate(30 20 62)"><rect x="0" y="58" width="20" height="9" rx="4.5" fill="#CE3D80"/></g>
    <g transform="rotate(-52 80 62)"><rect x="76" y="58" width="24" height="9" rx="4.5" fill="#CE3D80"/></g>
    <path d="M41,36 C34,31 26,30 21,34 C16,38 19,45 26,45 C32,45 38,41 41,36 Z" fill="#2C8B4E"/>
    <path d="M57,34 C62,27 70,24 76,28 C81,32 78,39 71,40 C65,40 60,37 57,34 Z" fill="#3DAE62"/>
    <path d="M50,32 C28,31 14,45 14,62 C14,81 30,98 44,108 C47,111 48,114 50,116 C52,114 53,111 56,108 C70,98 86,81 86,62 C86,45 72,31 50,32 Z" fill="#CE3D80"/>
    <path d="M63,35 C76,41 86,50 86,62 C86,79 73,94 58,106 C69,91 78,76 78,62 C78,51 72,42 63,35 Z" fill="#8E1A52" opacity="0.85"/>
    <circle cx="38" cy="58" r="5.4" fill="#3A0D24"/>
    <circle cx="39.8" cy="56.2" r="1.9" fill="#FFFFFF"/>
    <circle cx="63" cy="58" r="5.4" fill="#3A0D24"/>
    <circle cx="64.8" cy="56.2" r="1.9" fill="#FFFFFF"/>
    <path d="M44,71 Q50.5,79 57,71" stroke="#3A0D24" stroke-width="3" fill="none" stroke-linecap="round"/>
    <circle cx="28" cy="70" r="4.2" fill="#EE9CC4" opacity="0.75"/>
    <circle cx="73" cy="70" r="4.2" fill="#EE9CC4" opacity="0.75"/>
    <path d="M50,116 C49,121 52,124 49,129 C47,132 44,132 43,130" stroke="#8E1A52" stroke-width="2.8" stroke-linecap="round" fill="none"/>
  </g>
  <circle cx="81" cy="85" r="5.2" fill="#CE3D80"/>
</svg>
