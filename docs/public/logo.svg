<svg xmlns="http://www.w3.org/2000/svg" viewBox="24 10 112 146" width="112" height="146" fill="none">
  <!-- dependency injection: the beet IS the plug — its taproot the prong,
       the port a socket. Blue is di's accent in the btravstack family
       (unthrown teal #3FB0A5, demesne purple #B45CE0, entity mauve #33262C). -->
  <!-- socket plate -->
  <rect x="30" y="118" width="100" height="34" rx="10" fill="#3E7FD4"/>
  <rect x="37" y="125" width="86" height="20" rx="6" stroke="#A9CBF5" stroke-width="2.5" fill="none" opacity="0.55"/>
  <circle cx="46" cy="135" r="3" fill="#A9CBF5" opacity="0.8"/>
  <circle cx="114" cy="135" r="3" fill="#A9CBF5" opacity="0.8"/>
  <!-- the slot rises slightly above the plate: an opening, not a sticker -->
  <rect x="71" y="114" width="18" height="14" rx="5" fill="#1B3350"/>
  <!-- the beet, descending into its port -->
  <g transform="translate(30,8)">
    <path d="M49,32 C47,27 48,22 51,18" stroke="#2C8B4E" stroke-width="2.6" stroke-linecap="round" fill="none"/>
    <path d="M51,18 C47,16 46,11 50,9 C55,7 57,12 56,15 C55,17 53,18 51,18 Z" fill="#3DAE62"/>
    <path d="M41,36 C34,31 26,30 21,34 C16,38 19,45 26,45 C32,45 38,41 41,36 Z" fill="#2C8B4E"/>
    <path d="M57,34 C62,27 70,24 76,28 C81,32 78,39 71,40 C65,40 60,37 57,34 Z" fill="#3DAE62"/>
    <path d="M50,32 C28,31 14,45 14,62 C14,81 30,98 44,108 C47,111 48,114 50,116 C52,114 53,111 56,108 C70,98 86,81 86,62 C86,45 72,31 50,32 Z" fill="#CE3D80"/>
    <path d="M63,35 C76,41 86,50 86,62 C86,79 73,94 58,106 C69,91 78,76 78,62 C78,51 72,42 63,35 Z" fill="#8E1A52" opacity="0.85"/>
    <circle cx="38" cy="58" r="5.4" fill="#3A0D24"/>
    <circle cx="39.8" cy="56.2" r="1.9" fill="#FFFFFF"/>
    <circle cx="63" cy="58" r="5.4" fill="#3A0D24"/>
    <circle cx="64.8" cy="56.2" r="1.9" fill="#FFFFFF"/>
    <path d="M45,69 Q50.5,75 56,69" stroke="#3A0D24" stroke-width="3" stroke-linecap="round" fill="none"/>
    <circle cx="28" cy="70" r="4.2" fill="#EE9CC4" opacity="0.75"/>
    <circle cx="73" cy="70" r="4.2" fill="#EE9CC4" opacity="0.75"/>
  </g>
  <!-- contact made -->
  <g stroke="#A9CBF5" stroke-width="3" stroke-linecap="round" opacity="0.9">
    <path d="M66,108 l-5,-6"/>
    <path d="M60,112 l-7,-3"/>
    <path d="M94,108 l5,-6"/>
    <path d="M100,112 l7,-3"/>
  </g>
</svg>
