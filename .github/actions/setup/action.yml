name: "Setup Node.js and pnpm"
description: "Setup Node.js and pnpm, install dependencies"

# CI calls btravstack/tools' reusable workflow, which does its own setup. This
# composite is what deploy-docs.yml — the one workflow here that runs its own
# steps — uses for the same toolchain, as the sibling btravstack repos do.

runs:
  using: "composite"
  steps:
    - name: Setup pnpm
      uses: pnpm/action-setup@v6

    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version-file: .node-version
        cache: pnpm

    - name: Setup Turbo Cache
      uses: actions/cache@v6
      with:
        path: .turbo
        key: ${{ runner.os }}-turbo-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-turbo-

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
