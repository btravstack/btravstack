name: CI
permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: btravstack/tools/.github/workflows/ci-reusable.yml@workflows-v1
    with:
      # "" uses .node-version (the dev version). 22.22 is the ROOT package's
      # engines floor — raised from 22.19 with `testcontainers@12.1.0`, which
      # declares `>= 22.22`; under `engineStrict: true` the floor is whatever
      # the dev toolchain's highest demand is, so this row and the root
      # `engines` move together or the install fails here. 24 and 26 cover the
      # current LTS and the live release
      # line; 24 overlaps "" while .node-version stays on 24.x and is listed
      # explicitly so bumping that file does not silently drop 24 coverage.
      #
      # The PUBLISHED package's floor (`engines: ">=22"`) is on the same major
      # as the `22.22` row, so the promise is exercised rather than merely
      # declared — which it was not while the floor read `>=20`: these jobs run
      # the dev toolchain, and pnpm 11 needs `node:sqlite`, which Node 20 does
      # not have, so that line could never run here. The row is still 22.22
      # rather than 22.0 because `engineStrict` pins it to the toolchain's
      # highest demand; 22.0-22.21 are covered by the major, not by a job.
      node-versions: '["", "22.22", "24", "26"]'
      # The reusable default appends `--coverage`; packages/core already runs
      # `vitest run --coverage` (with 100% thresholds), and the root script is
      # `turbo run test`, which would take the extra flags as its own.
      test-command: "pnpm test"
      # "A user-facing change needs a changeset" was convention alone until
      # this line: the job was skipped because the input defaults to `false`.
      # The reusable workflow exempts the release PR itself, so turning it on
      # costs nothing on the one PR that legitimately has no changeset.
      #
      # `integration-tests` stays off deliberately and is NOT the same gap: the
      # Docker-backed suites already run inside `pnpm test` on the runner —
      # `oidc.spec`, `amqp-runtime.spec`, `api.spec`, `cache.spec`, `smtp.spec`,
      # `s3.spec` and `ory.spec` are all in the job log — so the separate job
      # would run them a second time.
      changeset: true
